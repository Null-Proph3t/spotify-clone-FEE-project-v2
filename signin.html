<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Resonance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="logo">Resonance</div>
            <h2 style="margin-bottom: 30px;">Log in to Resonance</h2>

            <form id="signin-form" novalidate>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" class="form-control" placeholder="e.g., username@gmail.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Password" required>
                </div>
                <div class="form-error" id="form-error"></div>

                <button type="submit" class="btn btn-large" id="submit-btn">Log In</button>
            </form>

            <div class="auth-links">
                <p>Don't have an account? <a href="signup.html">Sign up for Resonance</a></p>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="auth.js"></script>
    <script src="store.js"></script>
    <script>
        var form = document.getElementById("signin-form");
        var errorBox = document.getElementById("form-error");
        var submitBtn = document.getElementById("submit-btn");

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            errorBox.textContent = "";
            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;

            if (!RAuth.validateEmail(email)) {
                errorBox.textContent = "Please enter a full email address (e.g., username@gmail.com).";
                return;
            }
            if (!password) {
                errorBox.textContent = "Please enter your password.";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Logging in…";

            RAuth.login(email, password).then(function (res) {
                if (res.ok) {
                    window.location.href = "index.html#/home";
                } else {
                    errorBox.textContent = res.error;
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Log In";
                }
            });
        });
    </script>
</body>
</html>
