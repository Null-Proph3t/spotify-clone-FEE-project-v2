<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonance - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">

        <div class="mobile-top-bar">
            <button class="menu-btn" onclick="toggleSidebar()">&#9776;</button>
            <div class="logo">Resonance</div>
        </div>

        <aside class="sidebar" id="sidebar">
            <button class="close-btn" onclick="toggleSidebar()">&times;</button>

            <div class="sidebar-top">
                <div class="logo desktop-logo">Resonance</div>
                <ul class="nav-links main-nav">
                    <li><a href="#/home" data-route="/home">Home</a></li>
                    <li><a href="#/search" data-route="/search">Search</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-head">
                    <h3>Your Library</h3>
                    <button class="lib-add-btn" data-action="create-playlist" title="Create playlist">+</button>
                </div>
                <ul class="nav-links playlist-nav" id="library-links">
                    <!-- populated by app.js -->
                </ul>
            </div>

            <div class="sidebar-section premium-box">
                <h3>Premium</h3>
                <p>Listen without limits.</p>
                <button class="btn" data-action="open-premium">View Plans</button>
            </div>

            <ul class="nav-links bottom-links" data-sidebar-auth>
                <!-- populated by ui.js -->
            </ul>
        </aside>

        <main class="main-content main-content-with-player">
            <div id="view-root">
                <div class="empty-state">Loading Resonance&hellip;</div>
            </div>
            <footer>
                <p>&copy; 2026 Resonance - Team No. 21</p>
            </footer>
        </main>
    </div>

    <!-- Persistent player bar -->
    <div class="player-bar player-bar-empty" id="player-bar">
        <div class="player-left">
            <div class="player-art" id="player-art"></div>
            <div class="player-meta">
                <div class="player-title" id="player-title">&nbsp;</div>
                <div class="player-artist" id="player-artist">&nbsp;</div>
            </div>
            <button class="icon-btn player-like" id="player-like" title="Like" aria-label="Like"></button>
        </div>
        <div class="player-center">
            <div class="player-controls">
                <button class="icon-btn" id="btn-shuffle" title="Shuffle" aria-label="Shuffle"></button>
                <button class="icon-btn" id="btn-prev" title="Previous" aria-label="Previous"></button>
                <button class="icon-btn icon-btn-play" id="btn-playpause" title="Play/Pause" aria-label="Play/Pause"></button>
                <button class="icon-btn" id="btn-next" title="Next" aria-label="Next"></button>
                <button class="icon-btn" id="btn-repeat" title="Repeat" aria-label="Repeat"></button>
            </div>
            <div class="player-progress">
                <span class="time" id="time-current">0:00</span>
                <input type="range" id="seek-bar" class="seek-bar" min="0" max="1000" value="0" step="1" aria-label="Seek">
                <span class="time" id="time-duration">0:00</span>
            </div>
        </div>
        <div class="player-right">
            <span class="player-context" id="player-context"></span>
            <button class="icon-btn" id="btn-queue" title="Queue" aria-label="Queue"></button>
            <button class="icon-btn" id="btn-mute" title="Mute" aria-label="Mute"></button>
            <input type="range" id="volume-bar" class="volume-bar" min="0" max="100" value="80" step="1" aria-label="Volume">
        </div>
    </div>

    <script src="data.js"></script>
    <script src="auth.js"></script>
    <script src="store.js"></script>
    <script src="ui.js"></script>
    <script src="search.js"></script>
    <script src="player.js"></script>
    <script src="app.js"></script>
    <script>
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("show");
        }
    </script>
</body>
</html>
