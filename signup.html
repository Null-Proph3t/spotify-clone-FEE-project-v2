<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Resonance</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="logo">Resonance</div>
            <h2 style="margin-bottom: 30px;">Sign up to start listening</h2>

            <form id="signup-form" novalidate>
                <div class="form-group">
                    <label for="email">What's your email?</label>
                    <input type="email" id="email" class="form-control" placeholder="e.g., username@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Create a password</label>
                    <input type="password" id="password" class="form-control" placeholder="At least 6 characters" required>
                </div>

                <div class="form-group">
                    <label for="profile-name">What should we call you?</label>
                    <input type="text" id="profile-name" class="form-control" placeholder="Enter a profile name." required>
                    <small style="color: var(--text-muted); font-size: 12px; display: block; margin-top: 5px;">This appears on your profile.</small>
                </div>

                <div class="form-error" id="form-error"></div>

                <button type="submit" class="btn btn-large" id="submit-btn">Sign Up</button>
            </form>

            <div class="auth-links">
                <p>Already have an account? <a href="signin.html">Log in here</a></p>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="auth.js"></script>
    <script src="store.js"></script>
    <script>
        var form = document.getElementById("signup-form");
        var errorBox = document.getElementById("form-error");
        var submitBtn = document.getElementById("submit-btn");

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            errorBox.textContent = "";
            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;
            var profileName = document.getElementById("profile-name").value;

            if (!RAuth.validateEmail(email)) {
                errorBox.textContent = "Please enter a full email address (e.g., username@gmail.com).";
                return;
            }
            if (!RAuth.validatePassword(password)) {
                errorBox.textContent = "Password must be at least 6 characters.";
                return;
            }
            if (!profileName.trim()) {
                errorBox.textContent = "Please tell us what to call you.";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Creating account…";

            RAuth.signup(email, password, profileName).then(function (res) {
                if (res.ok) {
                    window.location.href = "index.html#/home";
                } else {
                    errorBox.textContent = res.error;
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Sign Up";
                }
            });
        });
    </script>
</body>
</html>
